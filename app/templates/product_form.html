<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Editar{% else %}Novo{% endif %} Produto — Isac Achadinhos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        label { display: block; margin: 10px 0 4px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 14px; background: #ff9900; border: 0; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
        a { color: #ff9900; }
    </style>
</head>
<body>
    <p><a href="/admin/">← Voltar ao painel</a></p>
    <h1>{% if product %}Editar{% else %}Novo{% endif %} Produto</h1>
    <form method="post" action="{{ action }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="name">Nome</label>
        <input id="name" name="name" type="text" required maxlength="300" value="{{ product.name if product else '' }}">
        <label for="slug">Slug (letras minúsculas, números e hífens)</label>
        <input id="slug" name="slug" type="text" required maxlength="300" pattern="[a-z0-9-]+" value="{{ product.slug if product else '' }}">
        <label for="price">Preço</label>
        <input id="price" name="price" type="number" step="0.01" min="0.01" required value="{{ product.price if product else '' }}">
        <label for="category_id">Categoria</label>
        <select id="category_id" name="category_id" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
        <label for="description">Descrição</label>
        <textarea id="description" name="description" rows="4" maxlength="2000">{{ product.description if product and product.description else '' }}</textarea>
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
