<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Sculpy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fdf6ee; font-family: Arial, Helvetica, sans-serif; color: #222; }
  .voltar { display: block; max-width: 900px; margin: 16px auto 0; padding: 0 16px; color: #b45309; text-decoration: none; font-weight: bold; }
  .card { max-width: 900px; margin: 16px auto; background: #fff; border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: 24px; display: flex; gap: 28px; flex-wrap: wrap; }
  .foto { flex: 1 1 320px; }
  .foto img { width: 100%; border-radius: 12px; display: block; }
  .info { flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; }
  .loja { align-self: flex-start; background: #f59e0b; color: #222; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; }
  .preco { font-size: 32px; font-weight: bold; color: #15803d; }
  .botao { display: block; text-align: center; background: #f59e0b; color: #222; font-weight: bold; font-size: 20px; padding: 16px; border-radius: 12px; text-decoration: none; }
  .botao:hover { background: #d97706; }
  ul { margin: 0; padding-left: 20px; line-height: 1.8; }
  .selo { background: #ecfdf5; color: #166534; padding: 10px 14px; border-radius: 10px; font-weight: bold; }
  .aviso { max-width: 900px; margin: 0 auto 24px; padding: 0 16px; font-size: 12px; color: #666; text-align: center; }
</style>
</head>
<body>
<a class="voltar" href="index.html">&larr; voltar para a vitrine</a>
<div class="card">
  <div class="foto">
    <img src="imagens/lift_sculpy.gif" alt="Lift Sculpy">
  </div>
  <div class="info">
    <span class="loja">Monetizze</span>
    <h1>Lift Sculpy</h1>
    <div class="preco">R$ 257,90</div>
    <a class="botao" href="https://app.monetizze.com.br/r/ADV25844858" target="_blank" rel="noopener">Comprar agora</a>
    <ul>
      <li>Produto físico</li>
      <li>Categoria: saúde, bem-estar e beleza</li>
    </ul>
    <div class="selo">Garantia de 30 dias</div>
  </div>
</div>
<p class="aviso">Link de afiliado. O resultado varia de pessoa para pessoa.</p>
</body>
</html>
