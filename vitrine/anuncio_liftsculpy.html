<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Lift Sculpy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fafafa; color: #333; line-height: 1.6; }
    .container { max-width: 720px; margin: 0 auto; padding: 20px; background: #fff; }
    
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
    .product-img { flex: 1; min-width: 200px; max-width: 300px; }
    .product-img img { width: 100%; border-radius: 12px; background: #f5f5f5; aspect-ratio: 16/24; object-fit: contain; }
    .product-title { flex: 1; min-width: 200px; }
    .product-title h1 { font-size: 1.8rem; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; }
    .product-price { font-size: 0.95rem; color: #666; }
    
    .price-box { display: flex; align-items: baseline; gap: 8px; margin: 16px 0; }
    .old-price { text-decoration: line-through; font-size: 1rem; color: #888; }
    .new-price { color: #e53935; font-size: 1.3rem; font-weight: bold; }
    
    .buy-btn { display: block; width: 100%; background: #ff9900; color: #fff; font-weight: bold; padding: 14px; border-radius: 8px; text-decoration: none; font-size: 1rem; margin: 16px 0; transition: background 0.2s; }
    .buy-btn:hover { background: #e68a00; }
    
    .benefits { margin: 20px 0; }
    .benefits h3 { font-size: 1rem; color: #1a1a1a; margin: 8px 0 12px; }
    .benefit-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.9rem; color: #555; }
    .benefit-icon { width: 14px; height: 14px; background: #e3e3e3; border-radius: 4px; flex-shrink: 0; }
    
    .guarantee { background: #fff3e0; color: #ff6f00; padding: 8px 12px; border-radius: 20px; display: inline-block; font-size: 0.85rem; margin: 12px 0; }
    
    .disclaimer { font-size: 0.75rem; color: #777; margin-top: 24px; line-height: 1.4; }
    
    @media (max-width: 520px) { 
      .header { flex-direction: column; text-align: center; } 
      .product-img { order: 2; max-width: 100%; } 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="product-img">
        <img src="imagens/lift_sculpy.jpg" alt="Lift Sculpy" loading="lazy">
      </div>
      <div class="product-title">
        <h1>Lift Sculpy</h1>
        <div class="price-box">
          <span class="old-price">R$ 257,90</span>
          <span class="new-price">R$ 257,90</span>
        </div>
      </div>
    </div>
    
    <a href="https://app.monetizze.com.br/r/ADV25844858" class="buy-btn" target="_blank" rel="noopener">Comprar agora</a>
    
    <div class="benefits">
      <h3>Benefícios</h3>
      <div class="benefit-item"><span class="benefit-icon"></span>Ação detox</div>
      <div class="benefit-item"><span class="benefit-icon"></span>Produto em caps</div>
      <div class="benefit-item"><span class="benefit-icon"></span>Fácil de incorporar na rotina</div>
    </div>
    
    <span class="guarantee">Garantia de 30 dias</span>
    
    <p class="disclaimer">link de afiliado; o resultado varia de pessoa para pessoa</p>
  </div>
</body>
</html>
