<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isac Achadinhos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eaeded;color:#111}
header{background:#131921;padding:14px 24px}
.logo{display:inline-block;border:2px solid #ff9900;color:#ff9900;font-weight:bold;font-size:24px;padding:4px 12px;border-radius:4px}
.hero{background:#232f3e;padding:26px 24px;color:#fff}
.hero h1{margin:0 0 6px;color:#ff9900;font-size:34px}
.hero p{margin:0}
.wrap{display:flex;gap:20px;max-width:1200px;margin:20px auto;padding:0 16px}
aside{width:230px;flex:none;background:#232f3e;border-radius:10px;padding:14px;align-self:flex-start;position:sticky;top:16px}
aside h2{color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
aside button{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:#fff;font-size:16px;padding:12px;border-radius:8px;cursor:pointer;text-align:left}
aside button:hover{background:#37475a}
aside button.on{background:#ff9900;color:#111;font-weight:bold}
main{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden;display:flex;flex-direction:column}
.foto{background:#fdf6ee;height:240px;display:flex;align-items:center;justify-content:center;font-size:80px}
.foto img{max-width:100%;max-height:100%;object-fit:contain}
.corpo{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{align-self:flex-start;background:#ff9900;font-size:11px;font-weight:bold;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.nome{font-weight:bold;font-size:17px}
.antes{color:#777;text-decoration:line-through;font-size:13px}
.preco{color:#c8102e;font-size:26px;font-weight:bold}
.info{font-size:13px;color:#555}
.btn{margin-top:auto;display:block;text-align:center;background:#ff9900;color:#111;font-weight:bold;padding:12px;border-radius:8px;text-decoration:none}
.btn:hover{background:#e68a00}
.vazio{background:#fff;padding:30px;border-radius:12px;text-align:center;color:#555}
.aviso{text-align:center;font-size:12px;color:#555;padding:20px}
@media(max-width:760px){.wrap{flex-direction:column}aside{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}aside h2{width:100%}aside button{width:auto;gap:8px}}
</style>
</head>
<body>
<header><span class="logo">isac achadinhos</span></header>
<div class="hero"><h1>Isac Achadinhos</h1><p>Achou, é nosso! Ofertas novas todos os dias.</p></div>
<div class="wrap">
  <aside><h2>Lojas</h2><div id="menu"></div></aside>
  <main><div id="lista" class="grid"></div></main>
</div>

var atual = "Todos";
function menu(){
  var h = "";
  LOJAS.forEach(function(l){
    var n = l==="Todos" ? PRODUTOS.length : PRODUTOS.filter(function(p){return p.loja===l}).length;
    h += '<button class="'+(l===atual?"on":"")+'" onclick="escolher(\''+l+'\')"><span>'+l+'</span><span>'+n+'</span></button>';

}
function lista(){
  var ps = PRODUTOS.filter(function(p){return atual==="Todos" || p.loja===atual});

}
